name: Calculer les KPI Q2 et Q3

on:
  push:
    branches:
      - docs/notebooks-exploration-v0-2026-11-19
    paths:
      - .github/workflows/calculer-kpi-q2-q3.yml
      - scripts/calculer_scenarios_q2_q3.py
      - tests/test_scenarios_q2_q3.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/notebooks-exploration-v0-2026-11-19
          fetch-depth: 0
      - name: Vérifier le moteur et les tests
        run: |
          python3 -m py_compile scripts/calculer_scenarios_q2_q3.py
          python3 -m unittest discover -s tests -v
      - name: Produire les indicateurs réels
        run: python3 scripts/calculer_scenarios_q2_q3.py
      - name: Vérifier les rapports et tables produits
        run: |
          python3 -m json.tool docs/resultats/kpi_scenarios_q2_q3_manifest.json > /dev/null
          test -s docs/resultats/kpi_scenarios_q2_q3.csv
          test -s docs/resultats/jours_feu_et_31.csv
          test -s docs/resultats/kpi_scenarios_q2_q3.md
      - name: Archiver les résultats en artefact CI
        uses: actions/upload-artifact@v4
        with:
          name: kpi-q2-q3
          path: |
            docs/resultats/kpi_scenarios_q2_q3.csv
            docs/resultats/kpi_scenarios_q2_q3_manifest.json
            docs/resultats/kpi_scenarios_q2_q3.md
            docs/resultats/jours_feu_et_31.csv
          retention-days: 30
      - name: Committer les preuves sur la branche de revue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/resultats/kpi_scenarios_q2_q3.csv docs/resultats/kpi_scenarios_q2_q3_manifest.json docs/resultats/kpi_scenarios_q2_q3.md docs/resultats/jours_feu_et_31.csv
          if ! git diff --cached --quiet; then
            git commit -m "data(kpi) : publier les scénarios reproductibles Q2-Q3"
            git pull --rebase origin docs/notebooks-exploration-v0-2026-11-19
            git push origin HEAD:docs/notebooks-exploration-v0-2026-11-19
          fi
