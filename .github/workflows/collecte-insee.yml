name: Collecter le référentiel INSEE pour Q1 et Q4

on:
  push:
    branches:
      - docs/notebooks-exploration-v0-2026-11-19
    paths:
      - .github/workflows/collecte-insee.yml
      - scripts/collecter_cog_insee.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  referentiel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: docs/notebooks-exploration-v0-2026-11-19
      - name: Vérifier le script avant téléchargement
        run: python3 -m py_compile scripts/collecter_cog_insee.py
      - name: Extraire les communes et les départements de la région 76
        run: python3 scripts/collecter_cog_insee.py
      - name: Contrôler le manifeste et les fichiers produits
        run: |
          python3 -m json.tool datasets/public/insee_cog_2025/manifest.json > /dev/null
          test -s datasets/public/insee_cog_2025/occitanie_communes_2025.csv
          test -s datasets/public/insee_cog_2025/occitanie_departements_2025.csv
      - name: Versionner le référentiel et ses preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/public/insee_cog_2025/
          if ! git diff --cached --quiet; then
            git commit -m "data(insee) : archiver le COG 2025 d'Occitanie et les empreintes"
            git pull --rebase origin docs/notebooks-exploration-v0-2026-11-19
            git push origin HEAD:docs/notebooks-exploration-v0-2026-11-19
          fi
